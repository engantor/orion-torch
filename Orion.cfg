; ===========================================================================
;  ORION vessel class config
;  INSTALL TO:  <Orbiter>\Config\Vessels\Orion.cfg
; ===========================================================================
ClassName = Orion
Module = Orion

; --- MESH ---------------------------------------------------------------
; You have no 3D model yet, and that is fine. Borrow a stock Orbiter mesh so
; the vessel is VISIBLE from the first run. Swap it for your own later.
MeshName = ShuttlePB

; --- physical properties ------------------------------------------------
Size = 60.0
EmptyMass = 500000
CrossSections = 320.0 320.0 90.0
PMI = 180.0 180.0 22.0
GravityGradientDamping = 10.0

; Camera position inside the vessel (metres, vessel frame)
CameraOffset = 0 2.0 20.0
